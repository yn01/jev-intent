# ==========================================================================
# vocab.yaml — 検索語句レポート生成用の語彙定義
# 対象: デジタルカメラ・交換レンズ分野 / 自社: ニコン / 競合: キヤノン, ソニー
#
# 【記入ルール】
# - products 配下の各製品は、正式名(name)と検索で実際に打たれそうな
#   略称・表記揺れ(aliases)を持つ辞書形式で記入します:
#     - name: "EOS R5 Mark II"
#       aliases: ["R5 Mark II", "R5II", "r5 mark2", "R5 マーク2"]
#   生成時は name / aliases から重み付き（aliasesの方を多めに）で
#   表記を選び、選んだ表記を queries.csv の product_surface 列に残します。
#   aliases が空、または単純な文字列（例: "Z9"）のままでも構いません
#   （その場合は常に name がそのまま使われます）。
# - product_categories は products が空でも generate.py が動くように
#   用意したフォールバック用の一般名詞です（製品名確定後もそのまま
#   併用してOK。むしろ一般名詞クエリの再現に有用です）。
# - brands / modifiers / templates / out_of_category は仮埋め済みです。
#   （generate.py がそのまま使う想定。必要に応じて増減してください）
# ==========================================================================

brands:
  own:
    key: "nikon"
    canonical: "ニコン"
    aliases: ["ニコン", "Nikon", "NIKON", "nikon"]
  competitors:
    canon:
      key: "canon"
      canonical: "キヤノン"
      aliases: ["キヤノン", "Canon", "CANON", "canon"]
    sony:
      key: "sony"
      canonical: "ソニー"
      aliases: ["ソニー", "Sony", "SONY", "sony", "α", "アルファ"]

# --------------------------------------------------------------------------
# 製品名・型番（name / aliases 形式）
# --------------------------------------------------------------------------
