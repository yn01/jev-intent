    - "レビュー"
    - "とは"
    - "設定方法"
    - "作例"
    - "初心者"
    - "評判"
    - "スペック"
    - "画質"
    - "口コミ"
  comparison:
    - "比較"
    - "vs"
    - "どっちがいい"
    - "違い"
    - "どちらを選ぶべき"
    - "比較 おすすめ"
    - "性能比較"
  transactional:
    - "価格"
    - "最安値"
    - "購入"
    - "中古"
    - "在庫"
    - "セール"
    - "キャンペーン"
    - "通販"
    - "値段"
    - "下取り"
  navigational:
