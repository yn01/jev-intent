    - "サポート"
    - "ダウンロード"
    - "取扱説明書"
    - "修理"
    - "問い合わせ"
    - "ログイン"
    - "会員登録"

templates:
  informational:
    - "{brand} {product} {modifier}"
    - "{product} {modifier}"
    - "{brand} カメラ {modifier}"
    - "{brand} {product} 特徴"
    - "{product} {modifier} 初心者向け"
  comparison:
    - "{brand} {product} と {brand2} {product2} {modifier}"
    - "{brand} {product} {modifier} {brand2} {product2}"
    - "{product} {brand} {brand2} {modifier}"
    - "{brand} {brand2} {modifier}"
  transactional:
    - "{brand} {product} {modifier}"
    - "{product} {modifier} 楽天"
    - "{brand} {product} {modifier} amazon"
    - "{product} {modifier} 店舗"
    - "{brand} {product} {modifier} 予約"
  navigational:
    - "{brand} {modifier}"
    - "{brand} {product} {modifier}"
    - "{brand} カスタマーサポート"
    - "{brand} {product} 登録"

# 自社型番のみ・ブランド名なしで生成するテンプレ（{brand}を含まない）
# 生成時にこのブロックが使われた場合 own_product_only=1 を付与する。
templates_brandless:
  informational:
    - "{product} {modifier}"
    - "{product} {modifier} 初心者向け"
    - "{product} {modifier} まとめ"
  transactional:
    - "{product} {modifier}"
    - "{product} {modifier} 楽天"
    - "{product} {modifier} 店舗"
    - "{product} {modifier} 予約"
  navigational:
    - "{product} {modifier}"
    - "{product} {modifier} ダウンロード"
    - "{product} 登録"

# 曖昧な境界例（複数の意図シグナルを1クエリに混在させる）用テンプレ
ambiguous_templates:
  - "{brand} {product} {modifier1} {modifier2}"
  - "{product} {modifier1} {modifier2}"
  - "{brand} {brand2} {product} {modifier1}"
  - "{brand} {product} {modifier1} どこで {modifier2}"

# カテゴリ外クエリ（デジタルカメラ・交換レンズと無関係な語彙）
